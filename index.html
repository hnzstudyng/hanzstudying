<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Manager - Hanz Studying</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #1e40af;
            --primary-light: #60a5fa;
            --background: #ffffff;
            --card-bg: #f9fafb;
            --border-color: #e5e7eb;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --dark-bg: #1f2937;
            --dark-card: #374151;
            --dark-border: #4b5563;
            --dark-text: #f3f4f6;
            --dark-text-secondary: #d1d5db;
        }

        body.dark-mode {
            --background: var(--dark-bg);
            --card-bg: var(--dark-card);
            --border-color: var(--dark-border);
            --text-primary: var(--dark-text);
            --text-secondary: var(--dark-text-secondary);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            margin-bottom: 2rem;
        }

        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        .nav-item.active {
            background-color: var(--primary);
            color: white;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.2rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--border-color);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            border-bottom: 1px solid var(--border-color);
            background-color: var(--card-bg);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.875rem;
            font-weight: 700;
        }

        .header-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Buttons */
        .btn {
            padding: 0.625rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--primary);
            color: white;
        }

        .btn-danger {
            background-color: var(--error);
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-small {
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
        }

        .btn-icon {
            padding: 0.5rem;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background-color: var(--background);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        /* Search */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 0.625rem 0.75rem 0.625rem 2rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            background-color: var(--background);
            color: var(--text-primary);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 18px;
            height: 18px;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .filter-group select {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            background-color: var(--background);
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
        }

        /* Cards */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .article-card {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 1rem;
        }

        .article-content {
            flex: 1;
        }

        .article-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .article-meta-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .article-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .article-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tag-secondary {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        .article-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-draft {
            background-color: var(--warning);
            color: white;
        }

        .status-published {
            background-color: var(--success);
            color: white;
        }

        /* Grid */
        .grid {
            display: grid;
            gap: 1rem;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .empty-icon {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1rem;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-subtitle {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--background);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.5rem;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            transition: background-color 0.2s;
        }

        .modal-close:hover {
            background-color: var(--border-color);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .spinner {
            display: inline-block;
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 1rem;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }

            .sidebar-nav {
                flex-direction: row;
                flex: 1;
                margin: 0 1rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .header-actions {
                width: 100%;
            }

            .search-box {
                max-width: 100%;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H6zm0 2h12v14H6V5zm2 2v2h8V7H8zm0 3v2h8v-2H8zm0 3v2h5v-2H8z"/>
                    </svg>
                    Hanz Blog
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-section="dashboard">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 5h4"/>
                    </svg>
                    Dashboard
                </button>
                <button class="nav-item" data-section="create">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    New Article
                </button>
                <button class="nav-item" data-section="drafts">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    Drafts
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Dashboard Section -->
            <section id="dashboard-section" class="view-section">
                <div class="header">
                    <div>
                        <h1 class="header-title">Published Articles</h1>
                        <p class="header-subtitle"><span id="article-count">0</span> articles published</p>
                    </div>
                </div>

                <div class="content">
                    <div class="search-container">
                        <div class="search-box">
                            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            <input type="text" id="search-input" placeholder="Search articles...">
                        </div>
                    </div>

                    <div class="filters">
                        <div class="filter-group">
                            <label class="filter-label">Category</label>
                            <select id="category-filter">
                                <option value="">All Categories</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Tag</label>
                            <select id="tag-filter">
                                <option value="">All Tags</option>
                            </select>
                        </div>
                    </div>

                    <div id="articles-container" class="grid">
                        <!-- Articles will be loaded here -->
                    </div>
                </div>
            </section>

            <!-- Create Article Section -->
            <section id="create-section" class="view-section" style="display: none;">
                <div class="header">
                    <div>
                        <h1 class="header-title">New Article</h1>
                        <p class="header-subtitle">Create a new article</p>
                    </div>
                </div>

                <div class="content">
                    <div class="card" style="max-width: 800px; margin: 0 auto;">
                        <form id="article-form">
                            <div class="form-group">
                                <label for="article-title">Title *</label>
                                <input type="text" id="article-title" placeholder="Enter article title" required>
                            </div>

                            <div class="form-group">
                                <label for="article-description">Description</label>
                                <input type="text" id="article-description" placeholder="Brief description">
                            </div>

                            <div class="form-group">
                                <label for="article-category">Category</label>
                                <input type="text" id="article-category" placeholder="e.g., Technology, Education">
                            </div>

                            <div class="form-group">
                                <label for="article-content">Content *</label>
                                <textarea id="article-content" placeholder="Write your article content..." required></textarea>
                            </div>

                            <div class="form-group">
                                <label for="article-tags">Tags (comma-separated)</label>
                                <input type="text" id="article-tags" placeholder="e.g., javascript, web development">
                            </div>

                            <div style="display: flex; gap: 1rem;">
                                <button type="submit" class="btn btn-primary">
                                    <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                    </svg>
                                    Publish Article
                                </button>
                                <button type="button" class="btn btn-secondary" id="save-draft-btn">
                                    <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
                                    </svg>
                                    Save Draft
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Drafts Section -->
            <section id="drafts-section" class="view-section" style="display: none;">
                <div class="header">
                    <div>
                        <h1 class="header-title">Draft Articles</h1>
                        <p class="header-subtitle"><span id="drafts-count">0</span> drafts</p>
                    </div>
                </div>

                <div class="content">
                    <div id="drafts-container" class="grid">
                        <!-- Draft articles will be loaded here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Article Detail Modal -->
    <div id="article-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Article Title</h2>
                <button class="modal-close" data-action="close-modal">×</button>
            </div>
            <div id="modal-body" style="margin-bottom: 1.5rem;">
                <!-- Article content will be loaded here -->
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" data-action="close-modal">Close</button>
                <button class="btn btn-danger" id="delete-article-btn">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Data Management
        const articleStorage = {
            get() {
                const data = localStorage.getItem('articles') || '[]';
                return JSON.parse(data);
            },
            set(articles) {
                localStorage.setItem('articles', JSON.stringify(articles));
            },
            add(article) {
                const articles = this.get();
                const newArticle = {
                    _id: Date.now().toString(),
                    ...article,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                articles.push(newArticle);
                this.set(articles);
                return newArticle;
            },
            update(id, article) {
                const articles = this.get();
                const index = articles.findIndex(a => a._id === id);
                if (index !== -1) {
                    articles[index] = { ...articles[index], ...article, updatedAt: new Date().toISOString() };
                    this.set(articles);
                    return articles[index];
                }
                return null;
            },
            delete(id) {
                const articles = this.get();
                const filtered = articles.filter(a => a._id !== id);
                this.set(filtered);
            },
            getById(id) {
                const articles = this.get();
                return articles.find(a => a._id === id);
            },
            getByStatus(status) {
                const articles = this.get();
                return articles.filter(a => a.status === status);
            }
        };

        // Initialize with sample data
        function initializeSampleData() {
            if (articleStorage.get().length === 0) {
                const sampleArticles = [
                    {
                        title: 'Getting Started with HTML & CSS',
                        description: 'Learn the basics of web development',
                        content: 'HTML and CSS are the foundation of web development...',
                        tags: ['html', 'css', 'web'],
                        category: 'Web Development',
                        status: 'published',
                        wordCount: 1500,
                        readTime: 8
                    },
                    {
                        title: 'JavaScript Tips & Tricks',
                        description: 'Improve your JavaScript skills',
                        content: 'Here are some useful JavaScript techniques that will help you write better code...',
                        tags: ['javascript', 'tips'],
                        category: 'Programming',
                        status: 'published',
                        wordCount: 2000,
                        readTime: 10
                    }
                ];

                sampleArticles.forEach(article => {
                    articleStorage.add(article);
                });
            }
        }

        // UI Management
        const ui = {
            currentArticleId: null,

            showSection(section) {
                document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
                document.getElementById(`${section}-section`).style.display = 'flex';
                document.getElementById(`${section}-section`).style.flexDirection = 'column';

                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.querySelector(`[data-section="${section}"]`).classList.add('active');

                if (section === 'dashboard') {
                    this.renderDashboard();
                } else if (section === 'drafts') {
                    this.renderDrafts();
                } else if (section === 'create') {
                    document.getElementById('article-form').reset();
                    this.ui = null;
                }
            },

            renderDashboard() {
                const articles = articleStorage.getByStatus('published');
                const container = document.getElementById('articles-container');
                const categoryFilter = document.getElementById('category-filter');
                const tagFilter = document.getElementById('tag-filter');

                // Update filters
                const categories = [...new Set(articles.map(a => a.category || 'General'))];
                const tags = [...new Set(articles.flatMap(a => a.tags || []))];

                categoryFilter.innerHTML = '<option value="">All Categories</option>' +
                    categories.map(c => `<option value="${c}">${c}</option>`).join('');
                tagFilter.innerHTML = '<option value="">All Tags</option>' +
                    tags.map(t => `<option value="${t}">${t}</option>`).join('');

                // Update count
                document.getElementById('article-count').textContent = articles.length;

                // Render articles
                if (articles.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <h3 class="empty-title">No articles yet</h3>
                            <p class="empty-subtitle">Create your first article to get started</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = articles.map(article => `
                        <div class="card article-card" data-article-id="${article._id}">
                            <div class="article-content">
                                <h3 class="article-title">${this.escapeHtml(article.title)}</h3>
                                <div class="article-meta">
                                    <span class="article-meta-item">
                                        <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                        </svg>
                                        ${new Date(article.createdAt).toLocaleDateString()}
                                    </span>
                                    <span class="article-meta-item">
                                        <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                        </svg>
                                        ${article.readTime || 5} min read
                                    </span>
                                    <span class="article-meta-item">
                                        <svg style="width: 16px; height: 16px;" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773c.418 1.02 1.614 2.747 4.612 5.744 2.998 2.997 4.723 4.194 5.744 4.612l.773-1.548a1 1 0 011.06-.54l4.435.74a1 1 0 01.836.986V20a1 1 0 01-1 1h-2.694a13.974 13.974 0 01-10.694-4.604 13.981 13.981 0 01-2.322-3.712 14.04 14.04 0 01-.605-2.905A1 1 0 012 3z"/>
                                        </svg>
                                        ${article.wordCount || 0} words
                                    </span>
                                </div>
                                ${article.description ? `<p class="article-description">${this.escapeHtml(article.description)}</p>` : ''}
                                <div class="article-tags">
                                    <span class="tag">${article.category || 'General'}</span>
                                    ${(article.tags || []).map(tag => `<span class="tag tag-secondary">${this.escapeHtml(tag)}</span>`).join('')}
                                </div>
                            </div>
                            <div class="article-actions">
                                <button class="btn-icon" title="View article" data-action="view-article">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            },

            renderDrafts() {
                const articles = articleStorage.getByStatus('draft');
                const container = document.getElementById('drafts-container');

                document.getElementById('drafts-count').textContent = articles.length;

                if (articles.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <h3 class="empty-title">No drafts</h3>
                            <p class="empty-subtitle">Start writing your next article</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = articles.map(article => `
                        <div class="card article-card" data-article-id="${article._id}">
                            <div class="article-content">
                                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
                                    <h3 class="article-title">${this.escapeHtml(article.title)}</h3>
                                    <span class="status-badge status-draft">Draft</span>
                                </div>
                                <div class="article-meta">
                                    <span class="article-meta-item">
                                        ${new Date(article.updatedAt).toLocaleDateString()}
                                    </span>
                                    <span class="article-meta-item">
                                        ${article.wordCount || 0} words
                                    </span>
                                </div>
                            </div>
                            <div class="article-actions">
                                <button class="btn-icon" title="Edit draft" data-action="edit-draft">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            },

            openArticleModal(articleId) {
                const article = articleStorage.getById(articleId);
                if (!article) return;

                this.currentArticleId = articleId;
                document.getElementById('modal-title').textContent = article.title;
                document.getElementById('modal-body').innerHTML = `
                    <div>
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                            <span class="status-badge status-${article.status}">${article.status}</span>
                            <span style="color: var(--text-secondary); font-size: 0.875rem;">
                                ${new Date(article.createdAt).toLocaleDateString()}
                            </span>
                        </div>
                        ${article.description ? `<p style="color: var(--text-secondary); margin-bottom: 1rem;">${this.escapeHtml(article.description)}</p>` : ''}
                        <div style="margin-bottom: 1.5rem;">
                            <strong style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; text-transform: uppercase; color: var(--text-secondary);">Category</strong>
                            <span class="tag">${this.escapeHtml(article.category || 'General')}</span>
                        </div>
                        ${article.tags && article.tags.length > 0 ? `
                            <div style="margin-bottom: 1.5rem;">
                                <strong style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; text-transform: uppercase; color: var(--text-secondary);">Tags</strong>
                                <div class="article-tags">
                                    ${article.tags.map(tag => `<span class="tag tag-secondary">${this.escapeHtml(tag)}</span>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                        <div style="background-color: var(--card-bg); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
                            <p style="color: var(--text-primary); line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;">
                                ${this.escapeHtml(article.content)}
                            </p>
                        </div>
                        <div style="display: flex; gap: 1rem; font-size: 0.875rem; color: var(--text-secondary);">
                            <span>📝 ${article.wordCount || 0} words</span>
                            <span>⏱️ ${article.readTime || 5} min read</span>
                        </div>
                    </div>
                `;
                document.getElementById('article-modal').classList.add('active');
            },

            closeArticleModal() {
                document.getElementById('article-modal').classList.remove('active');
                this.currentArticleId = null;
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        };

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            initializeSampleData();
            ui.renderDashboard();

            // Navigation
            document.querySelectorAll('[data-section]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const section = btn.dataset.section;
                    ui.showSection(section);
                });
            });

            // Article Form
            document.getElementById('article-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('article-title').value.trim();
                const content = document.getElementById('article-content').value.trim();
                const description = document.getElementById('article-description').value.trim();
                const category = document.getElementById('article-category').value.trim() || 'General';
                const tagsStr = document.getElementById('article-tags').value.trim();
                const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];

                if (!title || !content) {
                    alert('Please fill in all required fields');
                    return;
                }

                const wordCount = content.split(/\s+/).length;
                const readTime = Math.ceil(wordCount / 200);

                articleStorage.add({
                    title,
                    content,
                    description,
                    category,
                    tags,
                    status: 'published',
                    wordCount,
                    readTime
                });

                document.getElementById('article-form').reset();
                ui.showSection('dashboard');
            });

            // Save Draft Button
            document.getElementById('save-draft-btn').addEventListener('click', () => {
                const title = document.getElementById('article-title').value.trim();
                const content = document.getElementById('article-content').value.trim();
                const description = document.getElementById('article-description').value.trim();
                const category = document.getElementById('article-category').value.trim() || 'General';
                const tagsStr = document.getElementById('article-tags').value.trim();
                const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];

                if (!title) {
                    alert('Please enter a title');
                    return;
                }

                const wordCount = content.split(/\s+/).filter(w => w).length;
                const readTime = Math.ceil(wordCount / 200);

                articleStorage.add({
                    title,
                    content,
                    description,
                    category,
                    tags,
                    status: 'draft',
                    wordCount,
                    readTime
                });

                document.getElementById('article-form').reset();
                alert('Article saved as draft');
                ui.showSection('drafts');
            });

            // Article Actions
            document.addEventListener('click', (e) => {
                const articleCard = e.target.closest('.article-card');
                if (!articleCard) return;

                const articleId = articleCard.dataset.articleId;
                const action = e.target.closest('[data-action]')?.dataset.action;

                if (action === 'view-article') {
                    ui.openArticleModal(articleId);
                } else if (action === 'edit-draft') {
                    const article = articleStorage.getById(articleId);
                    if (article) {
                        document.getElementById('article-title').value = article.title;
                        document.getElementById('article-content').value = article.content;
                        document.getElementById('article-description').value = article.description || '';
                        document.getElementById('article-category').value = article.category || '';
                        document.getElementById('article-tags').value = (article.tags || []).join(', ');
                        ui.showSection('create');
                        articleStorage.delete(articleId);
                    }
                }
            });

            // Modal Actions
            document.querySelectorAll('[data-action="close-modal"]').forEach(btn => {
                btn.addEventListener('click', () => ui.closeArticleModal());
            });

            document.getElementById('delete-article-btn').addEventListener('click', () => {
                if (ui.currentArticleId && confirm('Are you sure you want to delete this article?')) {
                    articleStorage.delete(ui.currentArticleId);
                    ui.closeArticleModal();
                    ui.renderDashboard();
                }
            });

            // Close modal on background click
            document.getElementById('article-modal').addEventListener('click', (e) => {
                if (e.target.id === 'article-modal') {
                    ui.closeArticleModal();
                }
            });

            // Search and Filter
            document.getElementById('search-input').addEventListener('input', () => {
                const search = document.getElementById('search-input').value.toLowerCase();
                const categoryFilter = document.getElementById('category-filter').value;
                const tagFilter = document.getElementById('tag-filter').value;

                let articles = articleStorage.getByStatus('published');

                if (search) {
                    articles = articles.filter(a =>
                        a.title.toLowerCase().includes(search) ||
                        a.description.toLowerCase().includes(search) ||
                        a.content.toLowerCase().includes(search)
                    );
                }

                if (categoryFilter) {
                    articles = articles.filter(a => (a.category || 'General') === categoryFilter);
                }

                if (tagFilter) {
                    articles = articles.filter(a => (a.tags || []).includes(tagFilter));
                }

                const container = document.getElementById('articles-container');
                if (articles.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <h3 class="empty-title">No articles found</h3>
                            <p class="empty-subtitle">Try adjusting your search or filters</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = articles.map(article => `
                        <div class="card article-card" data-article-id="${article._id}">
                            <div class="article-content">
                                <h3 class="article-title">${ui.escapeHtml(article.title)}</h3>
                                <div class="article-meta">
                                    <span class="article-meta-item">
                                        <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                        </svg>
                                        ${new Date(article.createdAt).toLocaleDateString()}
                                    </span>
                                    <span class="article-meta-item">
                                        <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                        </svg>
                                        ${article.readTime || 5} min read
                                    </span>
                                </div>
                                ${article.description ? `<p class="article-description">${ui.escapeHtml(article.description)}</p>` : ''}
                                <div class="article-tags">
                                    <span class="tag">${article.category || 'General'}</span>
                                    ${(article.tags || []).map(tag => `<span class="tag tag-secondary">${ui.escapeHtml(tag)}</span>`).join('')}
                                </div>
                            </div>
                            <div class="article-actions">
                                <button class="btn-icon" title="View article" data-action="view-article">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            });

            document.getElementById('category-filter').addEventListener('change', () => {
                document.getElementById('search-input').dispatchEvent(new Event('input'));
            });

            document.getElementById('tag-filter').addEventListener('change', () => {
                document.getElementById('search-input').dispatchEvent(new Event('input'));
            });

            // Theme Toggle
            const themeToggle = document.getElementById('themeToggle');
            const isDarkMode = localStorage.getItem('darkMode') === 'true';

            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            }

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const newDarkMode = document.body.classList.contains('dark-mode');
                localStorage.setItem('darkMode', newDarkMode);
                themeToggle.textContent = newDarkMode ? '☀️' : '🌙';
            });
        });
    </script>
</body>
</html>
